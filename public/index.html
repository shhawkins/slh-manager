<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e6e2e2">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>slh Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Jost:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: the paper planner's two-page week spread on a desk, with the manager's notebook beside it.
   Marker colors belong to the five branches of the work. */
:root {
  --desk: #e6e2e2;
  --paper: #fbf9f8;
  --paper-2: #efebea;
  --ink: #1f1c1d;
  --ink-2: #5a5351;
  --ink-3: #9b9391;
  --rule: #dcd5d4;
  --wash: #ece7e6;
  --fly: #dfe8f6;
  --shadow: rgba(48, 36, 36, 0.12);
  --m-film: #2a5fc9;
  --m-music: #cf3f3b;
  --m-code: #7546c0;
  --m-biz: #2a8656;
  --m-print: #d4701c;
  --f-display: 'Jost', 'Futura', 'Avenir Next', 'Segoe UI', sans-serif;
  --f-hand: 'Caveat', 'Bradley Hand', 'Segoe Print', cursive;
  --f-body: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #121011; --paper: #1d1a1b; --paper-2: #282324; --ink: #efe9e7; --ink-2: #c0b7b4; --ink-3: #847a78;
    --rule: #393233; --wash: #2a2425; --fly: #1f2f47; --shadow: rgba(0, 0, 0, 0.45);
    --m-film: #79a2ff; --m-music: #ff7f76; --m-code: #b897ff; --m-biz: #5fd394; --m-print: #ffad5e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #121011; --paper: #1d1a1b; --paper-2: #282324; --ink: #efe9e7; --ink-2: #c0b7b4; --ink-3: #847a78;
  --rule: #393233; --wash: #2a2425; --fly: #1f2f47; --shadow: rgba(0, 0, 0, 0.45);
  --m-film: #79a2ff; --m-music: #ff7f76; --m-code: #b897ff; --m-biz: #5fd394; --m-print: #ffad5e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--desk); color: var(--ink); }
body { font-family: var(--f-display); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--desk); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [contenteditable]:focus-visible { outline: 2px solid var(--m-film); outline-offset: 2px; border-radius: 3px; }
input, textarea, select { font: inherit; color: inherit; }
.wrap { padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 0 40px; max-width: 1560px; margin: 0 auto; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--desk); padding-block: 12px 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font-weight: 700; font-size: 26px; letter-spacing: -0.5px; }
.brand span { font-family: var(--f-hand); font-size: 21px; color: var(--ink-2); font-weight: 600; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { font-weight: 500; font-size: 14px; letter-spacing: 1.2px; text-transform: uppercase; padding: 7px 11px; border-radius: 4px; color: var(--ink-2); }
.tab[aria-selected="true"] { color: var(--ink); background: var(--paper); box-shadow: 0 1px 0 var(--shadow); }
.tally { margin-left: auto; display: flex; align-items: center; gap: 10px; font-family: var(--f-hand); font-size: 20px; font-weight: 600; color: var(--ink-2); }
.tally svg { height: 30px; width: auto; overflow: visible; }
.saved { font-family: var(--f-hand); font-size: 17px; color: var(--ink-3); min-width: 70px; text-align: right; }

/* countdowns */
.counts { display: flex; flex-wrap: wrap; gap: 14px 34px; padding: 6px 4px 16px; align-items: center; }
.count { display: flex; align-items: center; gap: 12px; }
.count .n { font-family: var(--f-hand); font-weight: 700; font-size: 40px; line-height: 1; min-width: 56px; text-align: center; position: relative; padding: 4px 6px; }
.count .l { font-size: 13px; line-height: 1.25; color: var(--ink-2); }
.count .l b { display: block; color: var(--ink); font-weight: 600; font-size: 15px; }
.nextmove { margin-left: auto; background: var(--paper); border-radius: 6px; padding: 10px 14px; box-shadow: 0 1px 2px var(--shadow); max-width: 420px; min-width: 0; display: flex; gap: 12px; align-items: center; }
.nextmove .k { font-size: 11px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.nextmove .t { font-family: var(--f-hand); font-size: 23px; font-weight: 600; line-height: 1.1; }

/* layout with manager */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 22px; align-items: start; }
.views { min-width: 0; }
.mgr-tab { display: none; }
@media (max-width: 1179px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .manager { display: none; }
  .mgr-tab { display: inline-block; }
  body[data-tab="manager"] .manager { display: flex; }
  body[data-tab="manager"] .views { display: none; }
}
.view { display: none; }
body[data-tab="week"] #v-week, body[data-tab="goals"] #v-goals, body[data-tab="tree"] #v-tree, body[data-tab="review"] #v-review { display: block; }

/* the spread */
.weeknav { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.weeknav button { font-size: 13px; letter-spacing: 1px; text-transform: uppercase; font-weight: 500; padding: 6px 10px; border-radius: 4px; color: var(--ink-2); }
.weeknav button:hover { background: var(--paper); color: var(--ink); }
.spread { display: grid; grid-template-columns: 1fr 1fr; background: var(--paper); border-radius: 4px 4px 6px 6px; box-shadow: 0 2px 10px var(--shadow), 0 0 0 1px var(--rule); position: relative; }
.spread::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 34px; transform: translateX(-50%); background: linear-gradient(90deg, transparent, var(--shadow) 46%, var(--shadow) 54%, transparent); pointer-events: none; opacity: .7; }
.pg { padding: 22px 28px 24px; min-width: 0; display: flex; flex-direction: column; }
.pg.right { text-align: right; }
.pg-h { font-weight: 600; font-size: 30px; letter-spacing: -0.3px; line-height: 1; padding-bottom: 4px; border-bottom: 2.5px solid var(--ink); }
.day { flex: 1 0 auto; min-height: 168px; display: flex; flex-direction: column; border-bottom: 1.5px solid var(--ink); }
.day:last-of-type { border-bottom: 0; }
.day-h { display: flex; align-items: baseline; gap: 10px; padding: 8px 0 3px; border-bottom: 1px solid var(--rule); }
.pg.right .day-h { flex-direction: row-reverse; }
.day-h .dn { font-weight: 600; font-size: 19px; position: relative; padding: 0 3px; }
.day-h .tools { margin-left: auto; display: flex; gap: 4px; opacity: .55; }
.pg.right .day-h .tools { margin-left: 0; margin-right: auto; }
.day:hover .day-h .tools, .day:focus-within .day-h .tools { opacity: 1; }
.day-h .tools button { font-size: 12px; letter-spacing: .8px; text-transform: uppercase; padding: 3px 6px; border-radius: 3px; color: var(--ink-2); font-weight: 500; }
.day-h .tools button:hover { background: var(--wash); color: var(--ink); }
.day-h .tools button[aria-pressed="true"] { background: var(--fly); color: var(--ink); }
.day-b { flex: 1; padding: 4px 0 8px; background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 29px, var(--rule) 29px, var(--rule) 30px); line-height: 30px; text-align: left; }
.pg.right .day-b { text-align: right; }
.day.today .dn::after { content: ""; position: absolute; left: -2px; right: -2px; bottom: -3px; height: 6px; background: var(--m-film); opacity: .35; border-radius: 3px; transform: rotate(-1deg); }
.dl { font-family: var(--f-hand); font-weight: 700; font-size: 25px; display: inline-block; position: relative; padding: 0 10px; margin: 2px 4px 2px; line-height: 30px; }
.flying { font-family: var(--f-hand); font-size: 21px; font-weight: 600; color: var(--ink-2); display: inline-block; background: linear-gradient(transparent 30%, var(--fly) 30%, var(--fly) 88%, transparent 88%); padding: 0 6px; transform: rotate(-1deg); }
.mv { display: flex; align-items: baseline; gap: 8px; width: 100%; text-align: left; font-family: var(--f-hand); font-size: 21px; font-weight: 600; line-height: 30px; color: var(--c, var(--ink)); }
.pg.right .mv { flex-direction: row-reverse; text-align: right; }
.mv .bx { flex: none; width: 15px; height: 15px; border: 1.8px solid currentColor; border-radius: 2px 4px 2px 3px; transform: rotate(-4deg) translateY(2px); position: relative; }
.mv.done .bx::after { content: ""; position: absolute; left: 3px; top: -5px; width: 7px; height: 13px; border: solid currentColor; border-width: 0 3px 3px 0; transform: rotate(40deg); }
.mv .tt { flex: 1; min-width: 0; }
.mv.done .tt { text-decoration: line-through; text-decoration-thickness: 2px; opacity: .55; }
.mv .mn { font-family: var(--f-display); font-size: 11px; color: var(--ink-3); letter-spacing: .5px; flex: none; }
.mv .ed { flex: none; font-family: var(--f-display); font-size: 16px; color: var(--ink-3); width: 22px; border-radius: 3px; line-height: 22px; text-align: center; }
.mv .ed:hover { background: var(--wash); color: var(--ink); }
.mv .chk { flex: none; display: inline-flex; align-items: center; padding: 0 2px; color: inherit; }
.note { font-family: var(--f-hand); font-size: 21px; font-weight: 500; color: var(--ink-2); min-height: 30px; outline: none; }
.note:empty::before { content: attr(data-ph); color: var(--ink-3); opacity: .55; }
.minis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 14px; padding-top: 12px; border-top: 1.5px solid var(--ink); text-align: center; }
.mini { padding: 6px 4px 4px; border-radius: 2px; }
.mini.cur { background: var(--paper-2); }
.mini h5 { margin: 0 0 3px; font-size: 10.5px; letter-spacing: 1.4px; font-weight: 600; text-transform: uppercase; }
.mini table { width: 100%; border-collapse: collapse; table-layout: fixed; font-variant-numeric: tabular-nums; }
.mini th { font-size: 9px; color: var(--ink-3); font-weight: 600; }
.mini td { font-size: 11.5px; height: 19px; position: relative; padding: 0; }
.mini td.fl { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-color: var(--m-film); }
.mini td.td { font-weight: 700; }
@media (max-width: 760px) {
  .spread { grid-template-columns: 1fr; }
  .spread::after { display: none; }
  .pg.right { text-align: left; }
  .pg.right .day-h { flex-direction: row; }
  .pg.right .day-h .tools { margin-left: auto; margin-right: 0; }
  .pg.right .day-b { text-align: left; }
  .pg.right .mv { flex-direction: row; text-align: left; }
  .pg { padding: 18px 16px; }
  .pg.right .pg-h { display: none; }
  .nextmove { margin-left: 0; }
}

/* goals */
.goals { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
.goal { background: var(--paper); border-radius: 6px; box-shadow: 0 1px 3px var(--shadow); padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.goal .art { height: 180px; display: flex; align-items: center; justify-content: center; }
.goal .art svg, .goal .art img { max-height: 180px; max-width: 100%; width: auto; height: 100%; }
.goal .art img { object-fit: contain; }
.goal h2 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.2px; text-wrap: balance; }
.goal .meta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.goal .meta .n { font-family: var(--f-hand); font-size: 30px; font-weight: 700; color: var(--c); position: relative; padding: 0 8px; }
.bar { height: 22px; }
.goal ul { list-style: none; margin: 0; padding: 0; }
.goal li .mv { font-size: 20px; line-height: 28px; }
.goal li .when { font-family: var(--f-display); font-size: 11.5px; color: var(--ink-3); flex: none; letter-spacing: .3px; }
.goal li .when.late { color: var(--m-music); font-weight: 600; }
.goal .sub { font-size: 11px; letter-spacing: 1.3px; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin-top: 4px; }
.goal .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
.btn { font-size: 13px; font-weight: 500; letter-spacing: .6px; padding: 7px 12px; border-radius: 4px; border: 1.5px solid var(--ink); background: var(--paper); }
.btn:hover { background: var(--wash); }
.btn.solid { background: var(--ink); color: var(--paper); }
.btn.solid:hover { opacity: .88; }
.btn.ghost { border-color: var(--rule); color: var(--ink-2); }
.btn[disabled] { opacity: .45; cursor: default; }

/* tree */
.treebox { background: var(--paper); border-radius: 6px; box-shadow: 0 1px 3px var(--shadow); padding: 18px 10px 14px; overflow-x: auto; }
.treebox svg { display: block; min-width: 860px; width: 100%; height: auto; }
.tree-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; padding: 0 12px 6px; }
.tree-h h2 { margin: 0; font-size: 24px; font-weight: 600; }
.tree-h p { margin: 0; font-family: var(--f-body); font-size: 14.5px; color: var(--ink-2); max-width: 62ch; }

/* review */
.review { background: var(--paper); border-radius: 6px; box-shadow: 0 1px 3px var(--shadow); padding: 22px 26px; }
.review h2 { margin: 0 0 4px; font-size: 26px; font-weight: 600; }
.review .lede { font-family: var(--f-body); color: var(--ink-2); margin: 0 0 14px; font-size: 15px; }
.rcols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
@media (max-width: 820px) { .rcols { grid-template-columns: 1fr; } }
.rcol h3 { margin: 0 0 6px; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; padding-bottom: 4px; border-bottom: 1.5px solid var(--ink); }
.rcol ul { list-style: none; padding: 0; margin: 0 0 8px; }
.rcol li { font-family: var(--f-hand); font-size: 20px; font-weight: 600; line-height: 1.25; padding: 3px 0; color: var(--c, var(--ink)); }
.rcol .empty { font-family: var(--f-body); font-size: 14px; color: var(--ink-3); }
.ruled-input { width: 100%; min-height: 120px; resize: vertical; border: 0; background-color: transparent; background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 29px, var(--rule) 29px, var(--rule) 30px); line-height: 30px; font-family: var(--f-hand); font-size: 21px; font-weight: 500; padding: 0 2px; }
.pastrev { margin-top: 18px; border-top: 1px solid var(--rule); padding-top: 10px; }
.pastrev details { padding: 6px 0; border-bottom: 1px solid var(--rule); }
.pastrev summary { cursor: pointer; font-weight: 500; }
.pastrev p { font-family: var(--f-hand); font-size: 19px; margin: 4px 0; white-space: pre-wrap; }

/* manager */
.manager { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); background: var(--paper); border-radius: 6px; box-shadow: 0 1px 3px var(--shadow); display: flex; flex-direction: column; max-height: calc(100vh - 86px); min-height: 520px; }
@media (max-width: 1179px) { .manager { position: static; max-height: none; min-height: 70vh; } }
.mgr-h { padding: 16px 18px 10px; border-bottom: 2px solid var(--ink); }
.mgr-h h2 { margin: 0; font-size: 22px; font-weight: 600; }
.mgr-h p { margin: 2px 0 0; font-family: var(--f-hand); font-size: 18px; color: var(--ink-2); font-weight: 600; }
.chat { flex: 1; overflow-y: auto; padding: 12px 18px; display: flex; flex-direction: column; gap: 12px; min-height: 200px; }
.msg { max-width: 92%; min-width: 0; }
.msg.me { align-self: flex-end; font-family: var(--f-hand); font-size: 21px; font-weight: 600; line-height: 1.2; color: var(--m-film); text-align: right; }
.msg.mg { align-self: flex-start; font-family: var(--f-body); font-size: 15px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.mg .who { display: block; font-family: var(--f-display); font-size: 10.5px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin-bottom: 2px; }
.msg.sys { align-self: center; font-size: 12.5px; color: var(--ink-3); text-align: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 18px 0; }
.chip { font-family: var(--f-hand); font-size: 18px; font-weight: 600; padding: 2px 10px; border-radius: 14px; border: 1.5px solid var(--rule); color: var(--ink-2); }
.chip:hover { border-color: var(--ink-2); color: var(--ink); }
.compose { padding: 10px 18px 16px; display: flex; gap: 8px; align-items: flex-end; }
.compose textarea { flex: 1; min-width: 0; border: 0; background-color: transparent; background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 27px, var(--rule) 27px, var(--rule) 28px); line-height: 28px; resize: none; height: 58px; font-family: var(--f-hand); font-size: 21px; font-weight: 500; padding: 0; }

/* modal */
.modal-bg { position: fixed; inset: 0; background: rgba(20, 14, 14, .35); z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: var(--paper); border-radius: 8px; box-shadow: 0 10px 40px var(--shadow); width: min(460px, 100%); padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.modal h3 { margin: 0; font-size: 18px; font-weight: 600; }
.modal label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-2); font-weight: 500; }
.modal input, .modal select { font-size: 16px; text-transform: none; letter-spacing: 0; padding: 7px 8px; border: 1.5px solid var(--rule); border-radius: 4px; background: var(--paper); color: var(--ink); }
.modal .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal .acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 4px; }
.modal .acts .del { margin-right: auto; border-color: var(--m-music); color: var(--m-music); }
.banner { background: var(--paper); border-left: 4px solid var(--m-print); padding: 10px 14px; border-radius: 4px; margin: 0 0 12px; font-family: var(--f-body); font-size: 14.5px; }
.banner[hidden] { display: none !important; }
.ring-svg { position: absolute; pointer-events: none; overflow: visible; }
@media (prefers-reduced-motion: no-preference) { .star-new { animation: pop .6s ease-out; transform-origin: center; transform-box: fill-box; } @keyframes pop { 0% { transform: scale(.4); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } } }

/* refinements: margins, watercolor art, time tags, flying banner, timer, toasts */
.pg-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.pg.right .pg-h { justify-content: flex-end; }
.stars { display: flex; align-items: center; gap: 6px; font-family: var(--f-hand); font-size: 18px; font-weight: 600; color: var(--ink-2); padding: 0 4px 2px; border-radius: 4px; letter-spacing: 0; }
.stars:hover { color: var(--ink); background: var(--wash); }
.stars svg { width: 78px; height: 30px; overflow: visible; }
.pg-margin { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 2px 22px; padding: 8px 2px 2px; }
.mnote { font-family: var(--f-hand); font-size: 19px; font-weight: 600; line-height: 1.2; }
.mnote .oval { display: inline-block; padding: 0 8px; margin-left: 5px; background: color-mix(in srgb, currentColor 15%, transparent); border-radius: 11px 8px 12px 7px; }
.day-b { display: flex; gap: 10px; align-items: flex-start; }
.day-b .items { flex: 1; min-width: 0; }
.day-b .art { flex: none; width: 132px; padding-top: 6px; }
.day-b .art svg { display: block; width: 132px; height: 104px; overflow: visible; }
.pg.right .day-b { flex-direction: row-reverse; }
.load { font-size: 11.5px; color: var(--ink-3); letter-spacing: .4px; font-variant-numeric: tabular-nums; font-weight: 500; }
.load.heavy { color: var(--m-music); font-weight: 600; }
.flyrow { display: flex; align-items: center; gap: 8px; background: var(--fly); margin: 5px -6px 0; padding: 0 8px; border-radius: 3px; font-size: 11.5px; letter-spacing: 1.6px; text-transform: uppercase; font-weight: 600; color: var(--ink-2); line-height: 28px; min-width: 0; }
body[data-tab="week"] .nextmove { margin-left: 0; }
.flyrow svg { width: 18px; height: 18px; fill: var(--ink); flex: none; }
.pg.right .flyrow { flex-direction: row-reverse; }

function starPts(cx, cy, R, r) { const pts = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r : R; pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]); } return pts; }
let litBefore = null;
function renderTree() {
  const svg = document.getElementById('tree'); svg.innerHTML = ''; Ink.colors();
  const W = 1000, H = 640, colW = W / 5, top = 96, bottom = 610;
  const P = Ink.pen(svg, 1200);
  const litNow = new Set(S.moves.filter(m => m.done).map(m => m.id));
  ORDER.forEach((b, ci) => {
    const cx = colW * ci + colW / 2; const col = Ink.C[b === 'biz' ? 'biz' : b] || Ink.C.ink;
    const ms = S.moves.filter(m => m.b === b).sort((x, y) => (x.date || '9').localeCompare(y.date || '9'));
    const done = ms.filter(m => m.done).length;
    const keys = ms.filter(m => m.key);
    const lastLit = [...keys].reverse().find(m => m.done);
    Ink.txt(svg, cx, 28, BR[b].name.toUpperCase(), 14, { font: 'Jost, sans-serif', anchor: 'middle', weight: 600, fill: Ink.C.ink2 });
    Ink.txt(svg, cx, 58, lastLit ? lastLit.kl || lastLit.t : 'not yet', 25, { anchor: 'middle', weight: 700, fill: lastLit ? col : Ink.C.ink3 });
    Ink.txt(svg, cx, 78, `${done} / ${ms.length} moves`, 12, { font: 'Jost, sans-serif', anchor: 'middle', weight: 500, fill: Ink.C.ink3 });
    if (!ms.length) return;
    const wts = ms.map(m => m.key ? 2.6 : 1); let acc = 0; const cum = wts.map((w, i) => { const v = acc + (i ? w / 2 + wts[i - 1] / 2 : 0); acc = v; return v; });
    const span = cum[cum.length - 1] || 1;
    const pos = ms.map((m, i) => [cx + Math.sin(i * 0.9 + ci) * (colW * 0.16), top + (ms.length > 1 ? cum[i] / span : 0) * (bottom - top)]);
    let kIdx = 0;
    P.curve(svg, pos.length > 1 ? pos : [pos[0], [pos[0][0], pos[0][1] + 1]], { stroke: Ink.C.rule, strokeWidth: 1.2, roughness: .6 });
    ms.forEach((m, i) => {
      const [x, y] = pos[i];
      const isNew = litBefore && m.done && !litBefore.has(m.id);
      const gEl = Ink.g(svg); if (isNew) gEl.setAttribute('class', 'star-new');
      if (m.key) {
        P.poly(gEl, starPts(x, y, 13, 5.5), m.done ? { stroke: col, fill: col, fillStyle: 'solid', strokeWidth: 1.4, roughness: .8 } : { stroke: Ink.C.ink2, strokeWidth: 1.3, roughness: .8 });
        const right = (kIdx++ % 2 === 0);
        Ink.txt(svg, x + (right ? 20 : -20), y + 5, m.kl || m.t, 17, { anchor: right ? 'start' : 'end', weight: 600, fill: m.done ? col : Ink.C.ink3 });
      } else {
        P.circle(gEl, x, y, m.done ? 7 : 5, m.done ? { stroke: col, fill: col, fillStyle: 'solid', roughness: .5 } : { stroke: Ink.C.ink3, strokeWidth: 1, roughness: .5 });
      }
      const ttl = Ink.el('title', {}, gEl); ttl.textContent = `${m.t}${m.date ? ' · ' + short(m.date) : ''}${m.done ? ' · done' : ''}`;
    });
  });
  litBefore = litNow;
}

/* ---------- manager (Claude) ---------- */
const RULES = `You are the manager in an artist–manager arrangement for slh (Sam): musician, songwriter, photographer, filmmaker and linocut printmaker based in Chicago, who flies as a flight attendant about seven days a month. Sam makes the work; you hold the dates and hand him the next move.

How you work:
- One next move at a time. A move takes under 45 minutes and ends in something Sam can hold, hear or watch.
- Hold Sam to the release dates. Say plainly when he is working on the wrong thing for the nearest deadline.
- Flying days get layover work only (grading on the iPad, drawing, writing copy, emails), never recording or printing.
- When something slips, reschedule it onto a home day and say what moved.
- Make the decision; don't offer a menu of options.

How you write: direct and brief, plain text, short lines, at most a short list. No praise, no pep talk, no filler. Never use "not X, it's Y" constructions, "it is worth noting", "this is about", or a closing summary sentence. When you change the plan with a tool, name each change in one line.`;

  const soon = S.moves.filter(m => !m.done && m.date && m.date >= t && m.date <= horizon).sort((a, b) => a.date.localeCompare(b.date)).map(fmt).join('\n') || '- none';
  const later = S.moves.filter(m => !m.done && (!m.date || m.date > horizon)).length;
  const doneWk = S.moves.filter(m => m.done && m.doneOn >= iso(mondayOf(d0))).map(m => m.t).join('; ') || 'nothing yet';
  return `Today is ${DOW[d0.getDay()]}, ${short(t)}, ${d0.getFullYear()}.

Releases:
${dls}

Flying days ahead: ${fly}

Slipped (open, date passed):
${slipped}

Open moves, next three weeks:
${soon}

Open moves later or undated: ${later}
Done this week: ${doneWk}`;
}

      execute: (i) => { const m = S.moves.find(x => x.id === String(i.move_id)); if (!m) throw new Error('no move with that id'); if (!okDate(i.date)) throw new Error('date must be YYYY-MM-DD'); const from = m.date; m.date = String(i.date); change(); log(`Moved "${m.t}" ${from ? 'from ' + short(from) + ' ' : ''}to ${short(m.date)}.`); return 'ok'; } },
    { name: 'add_move', description: 'Add a new move (under 45 minutes) to a release. Returns the new move id.', inputSchema: { type: 'object', properties: { release_id: { type: 'string' }, title: { type: 'string' }, date: { type: 'string', description: 'YYYY-MM-DD' }, minutes: { type: 'number' } }, required: ['release_id', 'title', 'date'] },
      execute: (i) => { const d = delOf(String(i.release_id)); if (!d) throw new Error('no release with that id'); if (!okDate(i.date)) throw new Error('date must be YYYY-MM-DD'); const m = { id: uidGen(), d: d.id, b: d.b, t: String(i.title).slice(0, 140), date: String(i.date), min: Math.min(240, Math.max(5, Number(i.minutes) || 45)), done: false }; S.moves.push(m); change(); log(`Added "${m.t}" on ${short(m.date)}.`); return m.id; } },
    { name: 'set_flying', description: 'Mark days as flying (or back to home days). Returns "ok".', inputSchema: { type: 'object', properties: { dates: { type: 'array', items: { type: 'string' } }, flying: { type: 'boolean' } }, required: ['dates', 'flying'] },
      execute: (i) => { const ds = (Array.isArray(i.dates) ? i.dates : []).map(String).filter(okDate); if (!ds.length) throw new Error('no valid dates'); const set = new Set(S.flying); ds.forEach(x => i.flying === false ? set.delete(x) : set.add(x)); S.flying = [...set].sort(); change(); log(`${i.flying === false ? 'Home days' : 'Flying'}: ${ds.map(short).join(', ')}.`); return 'ok'; } },
  ];
}
let ctl = null;
function renderChat() {
  const box = document.getElementById('chat');
  if (!CHAT.length) {
    box.innerHTML = `<div class="msg sys">${sample ? 'Ask for your next move, or tell the manager a trip just landed.' : (window.claude ? 'The manager needs permission to use Claude in this view.' : 'Open this page in claude.ai to talk to the manager.')}</div>`;
  } else {
    box.innerHTML = CHAT.map(m => m.r === 'user' ? `<div class="msg me">${esc(m.t)}</div>` : m.r === 'sys' ? `<div class="msg sys">${esc(m.t)}</div>` : `<div class="msg mg"><span class="who">manager</span>${esc(m.t)}</div>`).join('');
  }
  box.scrollTop = box.scrollHeight;
}
const CHIPS = ['What\'s my next move?', 'I have 45 minutes', 'A trip just landed', 'Am I on track?'];
function renderChips() {
  const c = document.getElementById('chips');
  c.innerHTML = CHIPS.map((t, i) => `<button class="chip" data-chip="${i}" ${sample ? '' : 'disabled'}>${esc(t)}</button>`).join('');
  c.querySelectorAll('[data-chip]').forEach(b => b.onclick = () => {
    const t = CHIPS[+b.dataset.chip];
    if (t === 'A trip just landed') { const a = document.getElementById('ask'); a.value = 'A trip just landed: flying '; a.focus(); return; }
    ask(t);
  });
}
async function ask(text) {
  if (!sample || !text.trim()) return;
  CHAT.push({ r: 'user', t: text.trim() }); renderChat();
  const box = document.getElementById('chat');
  const bubble = document.createElement('div'); bubble.className = 'msg mg'; bubble.innerHTML = '<span class="who">manager</span>Thinking…'; box.appendChild(bubble); box.scrollTop = box.scrollHeight;
  ctl = new AbortController();
  document.getElementById('send').hidden = true; document.getElementById('stop').hidden = false;
  const turns = [{ role: 'user', content: RULES + '\n\n---\n' + context() }, ...CHAT.filter(m => m.r !== 'sys').slice(-14).map(m => ({ role: m.r, content: m.t }))];
  const opts = { signal: ctl.signal, onText: ({ text }) => { bubble.innerHTML = '<span class="who">manager</span>'; bubble.appendChild(document.createTextNode(text)); box.scrollTop = box.scrollHeight; } };
  if (canTools) opts.tools = toolsList(); else opts.cache = false;
  try {
    const { text: out } = await sample(turns, opts);
    CHAT.push({ r: 'assistant', t: out });
  } catch (e) {
    const code = e && e.code;
    if (e && e.text && code !== 'refused') CHAT.push({ r: 'assistant', t: e.text + (code === 'cancelled' ? '' : '\n(cut off)') });
    const msg = { not_granted: 'The manager is off for this view. Allow Claude for this page to turn it on.', sampling_disabled: 'Claude is not available on this account.', rate_limited: 'Too many requests right now. Try again in a few minutes.', session_expired: 'Sign in to claude.ai again, then retry.', refused: 'The manager declined that one. Rephrase it.', cancelled: '' }[code] ?? 'Something went wrong reaching Claude. Try again.';
    if (msg) CHAT.push({ r: 'sys', t: msg });
  } finally {
    ctl = null; document.getElementById('send').hidden = false; document.getElementById('stop').hidden = true;
    renderChat(); persistChat();
  }
}
document.getElementById('compose').onsubmit = (e) => { e.preventDefault(); const a = document.getElementById('ask'); const v = a.value; a.value = ''; ask(v); };
document.getElementById('ask').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('compose').requestSubmit(); } });
document.getElementById('stop').onclick = () => ctl && ctl.abort();

document.getElementById('nextW').onclick = () => { viewMonday = addDays(viewMonday, 7); renderAll(); };

/* ---------- web mode (Vercel): same app, own storage + Anthropic API ---------- */
function webPass() { try { return localStorage.getItem('slh-pass') || ''; } catch (e) { return ''; } }
function askPass(msg) {
  return new Promise((resolve) => {
    const root = document.getElementById('modalRoot');
    root.innerHTML = `<div class="modal-bg"><form class="modal" id="pform"><h3>slh manager</h3><label for="p-in">Passcode<input id="p-in" type="password" autocomplete="current-password" required></label>${msg ? `<p style="margin:0;color:var(--m-music);font-size:14px">${esc(msg)}</p>` : ''}<div class="acts"><button class="btn solid" type="submit">Open</button></div></form></div>`;
    setTimeout(() => document.getElementById('p-in').focus(), 0);
    document.getElementById('pform').onsubmit = (e) => { e.preventDefault(); const v = document.getElementById('p-in').value; try { localStorage.setItem('slh-pass', v); } catch (er) { } root.innerHTML = ''; resolve(v); };
  });
}
let passPromise = null;
async function webApi(path, opts) {
  opts = opts || {};
  for (let attempt = 0; attempt < 3; attempt++) {
    const r = await fetch(path, Object.assign({}, opts, { headers: Object.assign({ 'content-type': 'application/json', 'x-passcode': webPass() }, opts.headers || {}) }));
    if (r.status === 401) { passPromise = passPromise || askPass(attempt ? 'That passcode didn’t work.' : ''); await passPromise; passPromise = null; continue; }
    const body = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error((body && body.error && (body.error.message || body.error)) || ('HTTP ' + r.status)); e.status = r.status; throw e; }
    return body;
  }
  throw new Error('passcode');
}
async function webSample(turns, opts) {
  opts = opts || {};
  const tools = (opts.tools || []).map(t => ({ name: t.name, description: t.description, input_schema: t.inputSchema || { type: 'object', properties: {} } }));
  const messages = turns.map(t => ({ role: t.role, content: t.content }));
  let all = '';
  for (let round = 0; round < 6; round++) {
    if (opts.signal && opts.signal.aborted) throw { code: 'cancelled', text: all };
    let res;
    try { res = await webApi('/api/manager', { method: 'POST', body: JSON.stringify({ messages, tools }), signal: opts.signal }); }
    catch (e) { if (e && e.name === 'AbortError') throw { code: 'cancelled', text: all }; throw { code: e.status === 429 ? 'rate_limited' : 'upstream_error', message: String(e.message || e), text: all || undefined }; }
    const blocks = res.content || [];
    const text = blocks.filter(b => b.type === 'text').map(b => b.text).join('');
    if (text) { all += (all ? '\n\n' : '') + text; if (opts.onText) opts.onText({ text: all, delta: text }); }
    const uses = blocks.filter(b => b.type === 'tool_use');
    if (!uses.length || res.stop_reason !== 'tool_use') return { text: all || '(no reply)', truncated: res.stop_reason === 'max_tokens' };
    messages.push({ role: 'assistant', content: blocks });
    const results = [];
    for (const u of uses) {
      const tool = (opts.tools || []).find(t => t.name === u.name);
      let out, isErr = false;
      try { out = tool ? await tool.execute(u.input || {}, { signal: opts.signal }) : (isErr = true, 'unknown tool'); } catch (e) { out = 'Error: ' + (e && e.message || e); isErr = true; }
      results.push({ type: 'tool_result', tool_use_id: u.id, content: typeof out === 'string' ? out : JSON.stringify(out), is_error: isErr });
    }
    messages.push({ role: 'user', content: results });
  }
  return { text: all, truncated: true };
}
function downscale(file, max) {
  return new Promise((resolve, reject) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.82)); };
    img.onerror = () => { URL.revokeObjectURL(url); reject({ code: 'unsupported_type' }); };
    img.src = url;
  });
}
async function webBoot(banner) {
  setSaved('loading…');
  sample = webSample; canTools = true; renderChips(); renderChat();
  assets = { upload: async (file) => ({ id: await downscale(file, 700) }) };
  plannerRef = { set: (body) => webApi('/api/state', { method: 'PUT', body: JSON.stringify({ plan: body }) }) };
  chatRef = { set: (body) => webApi('/api/state?doc=chat', { method: 'PUT', body: JSON.stringify({ plan: body }) }) };
  const pull = async () => {
    try {
      const { plan } = await webApi('/api/state');
      loaded = true;
      if (!plan) { banner.hidden = false; banner.textContent = 'No plan saved yet. Add a move on any day, or ask the manager to set up your releases.'; setSaved(''); return; }
      banner.hidden = true;
      const j = JSON.stringify(plan);
      if (j === lastJSON || saving || dirty) { setSaved('saved'); return; }
      lastJSON = j; S = Object.assign({ deliverables: [], moves: [], flying: [], notes: {}, reviews: [] }, plan);
      setSaved('saved'); renderAll();
    } catch (e) { setSaved('offline'); }
  };
  await pull();
  try { const { plan } = await webApi('/api/state?doc=chat'); if (plan && !CHAT.length) { CHAT = (plan.m || []).slice(-40); lastChatJSON = JSON.stringify({ m: CHAT }); renderChat(); } } catch (e) { }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pull(); });
  setInterval(() => { if (document.visibilityState === 'visible' && !document.querySelector('.modal-bg') && !(document.activeElement && document.activeElement.isContentEditable)) pull(); }, 60000);
}

/* ---------- boot ---------- */
(function boot() {
  let t = 'week'; try { t = localStorage.getItem('slh-tab') || 'week'; } catch (e) { }
  if (t === 'manager' && matchMedia('(min-width: 1180px)').matches) t = 'week';
  document.body.dataset.tab = t;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
  renderAll(); renderChips(); renderChat();
  const banner = document.getElementById('banner');
  if (!window.claude || !window.claude.use) { webBoot(banner); return; }
  setSaved('loading…');
  window.claude.use('sample').then(async (s) => {
    sample = s || null;
    if (sample) { try { const l = await sample.limits(); canTools = !!(l && l.tools); } catch (e) { canTools = false; } }
    renderChips(); renderChat(); if (document.body.dataset.tab === 'review') renderReview();
  });
  window.claude.use('assets').then(a => { assets = a || null; if (document.body.dataset.tab === 'goals') renderGoals(); });
  Promise.all([window.claude.use('db'), window.claude.use('user')]).then(async ([d, u]) => {
    db = d; uid = u ? await u.id() : null;
    if (!db || !uid) { setSaved(''); banner.hidden = false; banner.textContent = 'Sign in to claude.ai to load and save your plan.'; return; }
    plannerRef = db.doc(`data/users/${uid}/planner`);
    chatRef = db.doc(`data/users/${uid}/chat`);
    plannerRef.onSnapshot((snap) => {
      if (!snap.exists) { if (!loaded) { loaded = true; setSaved(''); banner.hidden = false; banner.textContent = 'No plan saved yet. Add a move on any day, or ask the manager to set up your releases.'; } return; }
      const data = snap.data(); const j = JSON.stringify(data);
      loaded = true; banner.hidden = true;
      if (j === lastJSON || saving || dirty) { setSaved('saved'); return; }
      lastJSON = j;
      S = Object.assign({ deliverables: [], moves: [], flying: [], notes: {}, reviews: [] }, JSON.parse(j));
      setSaved('saved'); renderAll();
    }, () => { setSaved('offline'); });
    chatRef.get().then(snap => { if (snap.exists && !CHAT.length) { CHAT = (snap.data().m || []).slice(-40); lastChatJSON = JSON.stringify({ m: CHAT }); renderChat(); } }).catch(() => { });
  });
})();
